[project]
name = "steamy-py"
version = "1.2.0"
description = "Asynchronous Python wrapper for the Steam Web API"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

authors = [
    { name = "Roman Chursanov", email = "roman@chrsnv.ru" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "steam",
    "steam-api",
    "steam-web-api",
    "valve",
    "async",
    "asyncio",
    "aiohttp",
    "wrapper",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.13.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "yarl>=1.17.0",
]

[project.optional-dependencies]
speedups = [
    "aiohttp[speedups]>=3.13.2",
]

[project.urls]
Homepage = "https://github.com/AuthFailed/steamy-py"
Repository = "https://github.com/AuthFailed/steamy-py"
Issues = "https://github.com/AuthFailed/steamy-py/issues"
Changelog = "https://github.com/AuthFailed/steamy-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv-build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C90",   # mccabe complexity
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = [
    "live: calls the real Steam Web API (needs STEAM_API_KEY; run with -m live)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["steamy_py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
